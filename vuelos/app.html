<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yasui Flights</title>
<meta name="description" content="Vuelos ridículamente baratos y errores de tarifa saliendo de Puerto Rico. Escoge a dónde quieres ir y te avisamos por email.">
<script>try{var t=localStorage.getItem("yasui_tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.tema=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238A6240' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   Yasui Flights · modo claro = verde bosque y khaki · modo oscuro = bosque oscuro
   ===================================================================== */
:root{
  --bg:#F3EDE2; --bg2:#EAE1D0; --panel:#FBF8F2; --ink:#102820; --muted:#5F6A5E; --line:#E0D5C1;
  --hero:#102820; --hero2:#183A2E; --hero-ink:#EDE3CF; --hero-muted:#B9B39F; --hero-acc:#CABA9C;
  --acc:#8A6240; --acc-hover:#99704A; --acc-ink:#FFF8EE; --acc-sombra:#4D2D18; --acc-soft:#EFE2D2;
  --ganga-soft:#DDE6D3; --ganga-ink:#3E5537; --oferta-soft:#EADFD3; --oferta-ink:#4D2D18;
  --combo-soft:#E6DCC8; --combo-ink:#4D2D18;
  --precio:#8A6240; --ok:#4C6444; --warn:#8A4B1F; --warn-soft:#F4E6D6; --error:#A33B2A;
  --chip:#E6DCC8; --chip-on:#102820; --chip-on-ink:#EDE3CF; --foco:#CABA9C;
  --sky1:#F1E9DA; --sky2:#DCCDB1; --mt1:#4C6444; --mt2:#102820; --sun:#8A6240; --snow:#F7F2E8;
  --sea1:#7C9672; --sea2:#4C6444; --sand:#B79F7A; --cloud:#FBF8F2;
  --shadow:0 1px 2px rgba(16,40,32,.06),0 8px 24px rgba(16,40,32,.08);
  --shadow-up:0 6px 14px rgba(16,40,32,.10),0 22px 44px rgba(16,40,32,.14);
  --radius:18px; --serif:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --bg:#1E1B15; --bg2:#25211A; --panel:#29251C; --ink:#ECE6D6; --muted:#ABA48F; --line:#3A3528;
    --hero:#2B3220; --hero2:#3E482A; --hero-ink:#ECE6D6; --hero-muted:#B4AE98; --hero-acc:#C5CC9A;
    --acc:#B39468; --acc-hover:#C2A377; --acc-ink:#1E1B15; --acc-sombra:#69573B; --acc-soft:#3A3122;
    --ganga-soft:#39402A; --ganga-ink:#C5CC9A; --oferta-soft:#3A3122; --oferta-ink:#DCC9A6;
    --combo-soft:#333024; --combo-ink:#D9D6BE;
    --precio:#CBAA78; --ok:#B5BF7E; --warn:#E3B47E; --warn-soft:#3A2E1E; --error:#F08C76;
    --chip:#333024; --chip-on:#ECE6D6; --chip-on-ink:#1E1B15; --foco:#79804D;
    --sky1:#343A26; --sky2:#2B3220; --mt1:#79804D; --mt2:#1E1B15; --sun:#B39468; --snow:#D9D6BE;
    --sea1:#79804D; --sea2:#3E482A; --sand:#69573B; --cloud:#3E482A;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-tema="oscuro"]{
  --bg:#1E1B15; --bg2:#25211A; --panel:#29251C; --ink:#ECE6D6; --muted:#ABA48F; --line:#3A3528;
  --hero:#2B3220; --hero2:#3E482A; --hero-ink:#ECE6D6; --hero-muted:#B4AE98; --hero-acc:#C5CC9A;
  --acc:#B39468; --acc-hover:#C2A377; --acc-ink:#1E1B15; --acc-sombra:#69573B; --acc-soft:#3A3122;
  --ganga-soft:#39402A; --ganga-ink:#C5CC9A; --oferta-soft:#3A3122; --oferta-ink:#DCC9A6;
  --combo-soft:#333024; --combo-ink:#D9D6BE;
  --precio:#CBAA78; --ok:#B5BF7E; --warn:#E3B47E; --warn-soft:#3A2E1E; --error:#F08C76;
  --chip:#333024; --chip-on:#ECE6D6; --chip-on-ink:#1E1B15; --foco:#79804D;
  --sky1:#343A26; --sky2:#2B3220; --mt1:#79804D; --mt2:#1E1B15; --sun:#B39468; --snow:#D9D6BE;
  --sea1:#79804D; --sea2:#3E482A; --sand:#69573B; --cloud:#3E482A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .35s ease,color .35s ease}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.aviso-top{background:#E9D9A8;color:#2a2100;text-align:center;font-weight:650;font-size:13px;padding:6px 12px}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:8px}

/* ---------- animaciones base ---------- */
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes dibuja{to{stroke-dashoffset:0}}
@keyframes vuela{0%{transform:translate(-55vw,40px) rotate(8deg);opacity:0}15%{opacity:1}100%{transform:translate(55vw,-50px) rotate(-6deg);opacity:1}}
@keyframes estela{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes sube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#app > *{animation:entra .45s cubic-bezier(.2,.7,.2,1) both}
#app > *:nth-child(2){animation-delay:.06s}

/* ---------- bienvenida ---------- */
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 10%,var(--hero2),var(--hero));color:var(--hero-ink);display:grid;place-items:center;cursor:pointer;transition:opacity .55s ease,transform .55s ease;overflow:hidden}
.splash.fuera{opacity:0;transform:scale(1.03);pointer-events:none}
.splash-in{text-align:center;padding:0 24px;position:relative;z-index:2}
.splash small{display:block;font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--hero-acc);animation:sube .6s .15s both}
.splash h1{font-family:var(--serif);font-size:clamp(44px,9vw,92px);line-height:1;margin:14px 0 12px;letter-spacing:-.02em;font-weight:700;animation:sube .7s .3s both}
.splash p{margin:0;color:var(--hero-muted);font-size:16px;animation:sube .7s .5s both}
.splash .kanji{color:var(--hero-acc)}
.splash-vuelo{position:absolute;inset:0;z-index:1;pointer-events:none}
.splash-vuelo svg.ruta{position:absolute;left:0;top:28%;width:100%;height:40%}
.splash-vuelo .ruta path{fill:none;stroke:var(--hero-acc);stroke-width:2;stroke-dasharray:6 8;opacity:.45}
.splash-avion{position:absolute;left:50%;top:44%;width:44px;height:44px;margin:-22px;fill:var(--hero-acc);animation:vuela 2.1s cubic-bezier(.45,.05,.35,1) both}
.splash-montes{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;min-height:140px}
.splash-montes .m1{fill:var(--hero2);opacity:.9}
.splash-montes .m2{fill:var(--hero);opacity:.85}
.splash .saltar{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--hero-muted);z-index:3;animation:sube .6s 1s both}

/* ---------- header ---------- */
.hero{background:linear-gradient(180deg,var(--hero),var(--hero2));color:var(--hero-ink);position:relative;overflow:hidden;transition:background .35s ease}
.hero .wrap{position:relative;z-index:2}
.hero-montes{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;z-index:1;pointer-events:none}
.hero-montes .hm1{fill:var(--hero-acc);opacity:.10}
.hero-montes .hm2{fill:var(--hero-acc);opacity:.16}
.hero-ruta{position:absolute;right:4%;top:18px;width:300px;height:110px;z-index:1;pointer-events:none;opacity:.55}
.hero-ruta path{fill:none;stroke:var(--hero-acc);stroke-width:1.6;stroke-dasharray:4 6}
.hero-ruta .av{fill:var(--hero-acc);animation:flota 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.marca{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;color:var(--hero-ink);font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.01em}
.marca svg{width:22px;height:22px;fill:var(--hero-acc);transition:transform .3s ease}
.marca:hover svg{transform:translateX(3px) rotate(-8deg)}
.marca small{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--hero-acc)}
.derecha{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.menu button,.tema{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.10);color:var(--hero-ink);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;transition:background .2s ease,transform .15s ease}
.menu button:hover,.tema:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.menu button:active,.tema:active{transform:translateY(1px) scale(.97)}
.tema{width:36px;height:36px;padding:0;display:grid;place-items:center}
.tema svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.tema:hover svg{transform:rotate(25deg)}
.hero h1{font-family:var(--serif);font-size:clamp(30px,5.2vw,50px);line-height:1.05;margin:18px 0 10px;letter-spacing:-.02em;font-weight:700;max-width:780px}
.hero p.sub{color:var(--hero-muted);margin:0;max-width:640px;font-size:16px}
.hero .espacio{height:86px}
.kanji{font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:var(--hero-acc)}

/* ---------- tarjeta central ---------- */
.centro{max-width:480px;margin:-58px auto 40px;position:relative;z-index:3;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow-up);transition:background-color .35s ease,border-color .35s ease}
.panel h2{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;font-family:var(--serif)}
.panel p{margin:0 0 14px;color:var(--muted)}
label.campo{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}
input.txt{width:100%;font:inherit;font-size:16px;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none;transition:border-color .2s ease,box-shadow .2s ease,background-color .35s ease}
input.txt:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
input.txt:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
input.codigo{font:700 26px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4em;text-align:center;padding:13px 8px}

/* ---------- botones ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14.5px;font-weight:700;padding:12px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 var(--line);transition:transform .14s ease,box-shadow .14s ease,background-color .2s ease,filter .2s ease;-webkit-tap-highlight-color:transparent}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:0 4px 0 var(--acc-sombra)}
.btn.osc{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 70%,#000)}
.btn.full{width:100%;margin-top:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
@media (hover:hover){
  .btn:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 5px 0 var(--line),0 10px 20px rgba(0,0,0,.08)}
  .btn.pri:hover:not([disabled]){background:var(--acc-hover);box-shadow:0 6px 0 var(--acc-sombra),0 12px 24px color-mix(in srgb,var(--acc) 30%,transparent)}
  .btn.osc:hover:not([disabled]){box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 70%,#000),0 12px 24px rgba(0,0,0,.15)}
}
.btn:active:not([disabled]){transform:translateY(3px) scale(.985);box-shadow:0 0 0 var(--line)}
.btn.pri:active:not([disabled]){box-shadow:0 1px 0 var(--acc-sombra)}
.btn.osc:active:not([disabled]){box-shadow:0 1px 0 #000}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:color .2s ease}
.link:hover:not([disabled]){color:var(--acc-hover)}
.link[disabled]{color:var(--muted);cursor:default;text-decoration:none}
.nota{font-size:13px;color:var(--muted);margin-top:12px}
.error{color:var(--error);font-size:13.5px;margin-top:10px;min-height:1px}
.ok-txt{color:var(--ok);font-size:13.5px;margin-top:10px}
.puntos{display:grid;gap:12px;margin:20px 0 0;padding:0;list-style:none}
.puntos li{display:flex;gap:10px;font-size:14px;color:var(--muted)}
.puntos b{color:var(--ink)}
.puntos i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ganga-soft);color:var(--ganga-ink);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}

/* ---------- destinos ---------- */
.ancho{max-width:760px}
.buscador{position:relative}
.sugerencias{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-up);z-index:5;overflow:hidden;max-height:340px;overflow-y:auto;animation:entra .18s ease both}
.sug{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);transition:background-color .15s ease,padding-left .15s ease}
.sug:last-child{border-bottom:0}
.sug[aria-selected="true"],.sug:hover{background:var(--chip);padding-left:18px}
.sug b{font-weight:650}
.sug small{color:var(--muted);display:block;font-size:12.5px}
.sug .desde{font-size:12.5px;color:var(--ok);font-weight:700;white-space:nowrap}
.sug .ya{font-size:12px;color:var(--muted)}
.grupo{margin-top:18px}
.grupo h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:550;cursor:pointer;transition:transform .15s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
@media (hover:hover){.chip:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 4px 10px rgba(0,0,0,.08)}}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);animation:pop .3s ease}
.elegidos{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;margin-top:8px}
.elegido{display:inline-flex;align-items:center;gap:6px;background:var(--acc-soft);color:var(--ink);border-radius:999px;padding:5px 6px 5px 13px;font-size:14px;font-weight:650;animation:pop .3s ease}
.elegido small{font-weight:500;color:var(--muted)}
.elegido button{border:0;background:rgba(0,0,0,.08);width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1;font-size:14px;transition:background-color .15s ease,transform .15s ease}
.elegido button:hover{background:rgba(0,0,0,.18);transform:rotate(90deg)}
.vacio-sel{color:var(--muted);font-size:13.5px;align-self:center}
.contador{font-size:12.5px;color:var(--muted);margin-top:6px}
.todo-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-top:16px;padding:15px 16px;border-radius:16px;border:1.5px dashed var(--line);background:var(--bg);cursor:pointer;transition:transform .15s ease,border-color .2s ease,background-color .2s ease,box-shadow .2s ease}
@media (hover:hover){.todo-card:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:var(--shadow)}}
.todo-card:active{transform:scale(.99)}
.todo-card b{display:block;font-size:15.5px}
.todo-card small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.todo-check{flex:none;width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--panel);transition:background-color .2s ease,border-color .2s ease}
.todo-check svg{width:16px;height:16px;fill:none;stroke:transparent;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.todo-card.on{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.todo-card.on .todo-check{background:var(--acc);border-color:var(--acc);animation:pop .3s ease}
.todo-card.on .todo-check svg{stroke:var(--acc-ink)}
.o-separador{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:18px 0 0}
.o-separador::before,.o-separador::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- listo ---------- */
.listo{text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:var(--ganga-soft);color:var(--ok);display:grid;place-items:center;margin:2px auto 14px;animation:pop .5s .1s ease both}
.check svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:dibuja .5s .35s ease forwards}
.listo h2{font-size:28px}
.listo .chips{justify-content:center;margin:14px 0}
.listo .chip{cursor:default;background:var(--acc-soft);font-weight:650;animation:sube .4s both}
.caja{background:var(--bg2);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted);text-align:left;margin-top:12px}
.caja b{color:var(--ink)}
.acciones-listo{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* ---------- ofertas ---------- */
.saludo{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:24px 0 0}
.saludo h1{margin:0;font-family:var(--serif);font-size:clamp(28px,4.4vw,40px);letter-spacing:-.02em}
.saludo p{margin:6px 0 0;color:var(--hero-muted)}
h2.sec{font-family:var(--serif);font-size:24px;margin:34px 0 4px;letter-spacing:-.01em}
.h2sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.radar{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:-50px;position:relative;z-index:3}
.rd{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;transition:transform .2s ease,box-shadow .2s ease;animation:sube .45s both}
@media (hover:hover){.rd:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}}
.rd .t{font-weight:750;display:flex;justify-content:space-between;gap:6px}
.rd .t small{font-weight:650;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rd .p{font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--precio)}
.rd .p.sin{font-size:14px;font-weight:500;color:var(--muted)}
.rd .d{font-size:12.5px;color:var(--muted)}
.rd .hay{font-size:11.5px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.rd a{font-size:13px;font-weight:700;color:var(--acc);text-decoration:none;margin-top:4px}
.rd a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}

<script src="vendor/supabase.js"></script>
<script>
const DATOS = /*__DATOS__*/null;
const D = DATOS || {config:{}, ofertas:[], precios:{}, lugares:[], populares:[]};
const CFG = D.config || {};
const REGIONES = {japon:"Japón",hawaii:"Hawaii",usa:"EE.UU.",canada:"Canadá",europa:"Europa",caribe:"Caribe",latinoamerica:"Latinoamérica",asia:"Asia",oceania:"Oceanía",medio_oriente_africa:"Medio Oriente y África",otros:"Otros","*":"Cualquier error de tarifa",todo:"Cualquier destino"};
const REGION_RAPIDA = ["japon","hawaii","europa","usa","canada","caribe","latinoamerica","asia","*"];
const TODO = { t: "r", c: "todo", n: "Cualquier destino" };
const MAX_DESTINOS = 40;

/* ------------------------------------------------------------ utilidades */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dinero = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
const fmtFecha = d => { if(!d) return ""; const x = new Date(String(d).slice(0,10) + "T12:00:00"); return x.toLocaleDateString("es-PR",{day:"numeric",month:"short"}).replace(".",""); };
const dias = (a,b) => Math.round((new Date(b) - new Date(a)) / 864e5);
/* "2026-12-10T17:05..." -> "5:05 pm" (hora local de ese aeropuerto, tal como viene) */
const fmtHora = iso => { const m = /T(\d\d):(\d\d)/.exec(iso || ""); if (!m) return ""; const h = +m[1]; return `${h % 12 || 12}:${m[2]} ${h >= 12 ? "pm" : "am"}`; };
const fmtMin = n => n >= 60 ? `${Math.floor(n / 60)} h${n % 60 ? " " + (n % 60) + " min" : ""}` : `${n} min`;
/* De qué aeropuerto de PR sale (SJU casi siempre; a veces Aguadilla) */
const salidaDe = o => o.origen && o.origen !== "SJU" ? (o.origen_nombre || o.origen) : "SJU";
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9* ]+/g," ").trim();
function hace(iso){
  if(!iso) return "";
  const m = (Date.now() - new Date(iso)) / 6e4;
  if (m < 2) return "ahora";
  if (m < 60) return `hace ${Math.round(m)} min`;
  const h = m / 60; if (h < 24) return `hace ${Math.round(h)} h`;
  const d = h / 24; return d < 2 ? "ayer" : `hace ${Math.round(d)} días`;
}
const guardarLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const leerLocal = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } };
const ICON = {
  avion:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  vuelo:'<svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>',
  ojo:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  sol:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>',
  luna:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};

/* ------------------------------------------------------------ modo claro / oscuro */
const temaActual = () => document.documentElement.dataset.tema || (matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
function cambiarTema(){
  const nuevo = temaActual() === "oscuro" ? "claro" : "oscuro";
  document.documentElement.dataset.tema = nuevo;
  try { localStorage.setItem("yasui_tema", nuevo); } catch (e) {}
  document.querySelectorAll(".tema").forEach(b => { b.innerHTML = nuevo === "oscuro" ? ICON.sol : ICON.luna; b.setAttribute("aria-label", nuevo === "oscuro" ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); });
}
const botonTema = () => { const o = temaActual() === "oscuro"; return `<button class="tema" onclick="cambiarTema()" aria-label="${o ? "Cambiar a modo claro" : "Cambiar a modo oscuro"}" title="Modo claro / oscuro">${o ? ICON.sol : ICON.luna}</button>`; };

/* ------------------------------------------------------------ logos de aerolíneas */
function LOGO(iata, nombre){
  if (/^[A-Z0-9]{2}$/.test(iata || ""))
    return `<span class="logo" title="${esc(nombre || iata)}"><img src="https://img.wway.io/pics/root/${iata}@png?exar=1&rs=fit:64:64" alt="" loading="lazy" onerror="this.parentNode.classList.add('sin');this.parentNode.textContent='${iata}'"></span>`;
  const ini = String(nombre || "?").replace(/[^A-Za-z ]/g, "").split(" ").filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "✈";
  return `<span class="logo sin">${esc(ini)}</span>`;
}

/* ------------------------------------------------------------ postales por región */
function postal(region){
  const sol = (x, y, r = 13) => `<circle class="p-sol" cx="${x}" cy="${y}" r="${r}"/>`;
  let a = "";
  switch (region) {
    case "japon":
      a = sol(232, 30) + '<path class="p-mt1" d="M0 80 L70 36 L112 58 L165 18 L250 80Z"/><path class="p-nieve" d="M141 35 L165 18 L190 36 L179 33 L166 40 L152 33Z"/><path class="p-mt2" d="M96 80 L205 44 L300 80Z"/>'; break;
    case "hawaii": case "caribe": case "oceania":
      a = sol(66, 30) + '<path class="p-mar1" d="M0 56 Q38 48 76 56 T152 56 T228 56 T304 56 V80 H0Z"/><path class="p-mar2" d="M0 65 Q38 59 76 65 T152 65 T228 65 T304 65 V80 H0Z"/><path class="p-tronco" d="M232 60 C234 42 238 30 247 20"/><path class="p-hoja" d="M247 20 c-15 -3 -22 6 -24 11 M247 20 c13 -7 22 -3 26 2 M247 20 c4 -11 13 -13 18 -13 M247 20 c-8 -9 -17 -9 -21 -7"/>'; break;
    case "europa": {
      a = sol(238, 26) + '<path class="p-mt1" d="M0 80 Q60 52 130 64 T300 56 V80Z"/>';
      [[24,22,20],[46,28,18],[66,20,22],[90,34,16],[108,24,22],[132,18,18]].forEach(([x,h,w]) => { a += `<path class="p-mt2" d="M${x} 80 V${80-h} L${x+w/2} ${70-h} L${x+w} ${80-h} V80Z"/>`; });
      a += '<rect class="p-mt2" x="154" y="36" width="10" height="44"/><path class="p-mt2" d="M151 36 L159 22 L167 36Z"/>'; break; }
    case "usa": {
      a = sol(60, 28);
      [[110,40,22],[134,56,18],[154,30,24],[180,62,16],[198,44,22],[222,34,18],[242,50,20]].forEach(([x,h,w]) => {
        a += `<rect class="p-mt2" x="${x}" y="${80-h}" width="${w}" height="${h}"/>`;
        for (let yy = 84 - h; yy < 74; yy += 8) a += `<rect class="p-ventana" x="${x + 5}" y="${yy}" width="3" height="3"/><rect class="p-ventana" x="${x + w - 8}" y="${yy}" width="3" height="3"/>`;
      });
      a += '<path class="p-mt1" d="M0 80 Q80 66 150 76 T300 72 V80Z"/>'; break; }
    case "canada":
      a = sol(240, 28) + '<path class="p-mt1" d="M0 80 L80 30 L140 70 L200 34 L300 80Z"/><path class="p-nieve" d="M66 39 L80 30 L94 39 L86 37 L80 42 L73 37Z"/>';
      [[30,26],[52,34],[74,24],[200,30],[226,38],[252,28],[276,34]].forEach(([x,h]) => { a += `<path class="p-mt2" d="M${x} ${80-h} L${x-9} ${80-h/2} L${x-4} ${80-h/2} L${x-12} 80 L${x+12} 80 L${x+4} ${80-h/2} L${x+9} ${80-h/2}Z"/>`; });
      break;
    case "latinoamerica":
      a = sol(232, 26) + '<path class="p-mt1" d="M60 80 L126 30 L146 30 L214 80Z"/><path class="p-nieve" d="M120 35 L126 30 L146 30 L152 35 L142 33 L136 37 L130 33Z"/><path class="p-mt2" d="M0 80 Q70 60 140 72 T300 64 V80Z"/>'; break;
    case "asia":
      a = sol(70, 26, 12) + '<path class="p-mt1" d="M0 58 Q50 36 100 52 T200 46 T300 50 V80 H0Z" opacity=".55"/><path class="p-mt1" d="M0 66 Q60 48 120 62 T240 58 T300 62 V80 H0Z"/><path class="p-mt2" d="M0 74 Q70 64 140 72 T300 70 V80 H0Z"/>'; break;
    case "medio_oriente_africa":
      a = sol(220, 28, 15) + '<path class="p-arena" d="M0 64 Q70 44 140 62 T300 58 V80 H0Z"/><path class="p-mt1" d="M0 72 Q90 58 170 72 T300 70 V80 H0Z"/>'; break;
    default:
      a = '<g class="p-nube"><ellipse cx="60" cy="34" rx="28" ry="10"/><ellipse cx="82" cy="28" rx="18" ry="10"/><ellipse cx="214" cy="48" rx="30" ry="10"/><ellipse cx="238" cy="42" rx="18" ry="9"/></g><path class="p-ruta" d="M20 70 C 100 20, 200 20, 285 40"/>' + sol(150, 22, 9) + '<path class="p-mt1" d="M0 80 Q90 66 170 76 T300 72 V80Z"/>';
  }
  return `<div class="postal" aria-hidden="true"><svg viewBox="0 0 300 80" preserveAspectRatio="xMidYMax slice">${a}</svg></div>`;
}

/* ------------------------------------------------------------ lugares (buscador) */
const LUG = (D.lugares || []).map(([c,n,en,p,t]) => ({c, n, en, p, t, k: " " + norm(`${n} ${en}`) }));
const LUG_IDX = {}; LUG.forEach(l => LUG_IDX[l.t + ":" + l.c] = l);
const PAIS_NOMBRE = {}; LUG.forEach(l => { if (l.t === "p") PAIS_NOMBRE[l.c] = l.n; });
const PRECIOS = D.precios || {};

function mejorPrecio(d){
  if (d.t === "c") return PRECIOS[d.c] ? PRECIOS[d.c].precio : null;
  let mejor = null;
  for (const [c, p] of Object.entries(PRECIOS)) {
    const pais = p.pais || (LUG_IDX["c:" + c] || {}).p;
    const ok = d.t === "p" ? pais === d.c : (d.c === "todo" || (d.c !== "*" && p.region === d.c));
    if (ok && (mejor == null || p.precio < mejor)) mejor = p.precio;
  }
  return mejor;
}
function etiquetaTipo(l){
  if (l.t === "r") return l.c === "*" ? "Solo errores de tarifa, a donde sea" : (l.c === "todo" ? "Lo más barato a cualquier lugar" : "Región");
  if (l.t === "p") return "País";
  return [PAIS_NOMBRE[l.p] || l.p, l.en].filter(Boolean).join(" · ");
}
function sugerencias(q){
  const n = norm(q); if (!n) return [];
  const codigo = q.trim().toUpperCase();
  const res = [];
  for (const l of LUG) {
    let s = 0;
    if (l.c === codigo && l.t === "c") s = 120;
    else if (l.k.includes(" " + n)) s = 60 - Math.min(20, l.k.length / 4);
    else if (n.length >= 3 && l.k.includes(n)) s = 25;
    if (!s) continue;
    if (l.t === "p") s += 12;
    if (l.t === "r") s += 18;
    if (l.t === "c" && PRECIOS[l.c]) s += 15;
    if ((D.populares || []).includes(l.c)) s += 10;
    res.push([s, l]);
  }
  res.sort((a,b) => b[0] - a[0]);
  return res.slice(0, 8).map(x => x[1]);
}
const nombreDestino = d => d.n || (LUG_IDX[d.t + ":" + d.c] || {}).n || REGIONES[d.c] || d.c;

/* ------------------------------------------------------------ coincide (igual que en Python) */
function coincide(o, destinos){
  for (const d of destinos || []) {
    if (d.t === "c" && (d.c === o.destino || d.c === o.aeropuerto)) return true;
    if (d.t === "p" && d.c === o.pais) return true;
    if (d.t === "r" && (d.c === o.region || d.c === "todo" || (d.c === "*" && o.nivel >= 3))) return true;
  }
  return false;
}

/* ------------------------------------------------------------ cuentas: Supabase o modo prueba */
let sb = null;
try {
  if (CFG.supabase_url && CFG.supabase_key && window.supabase)
    sb = window.supabase.createClient(CFG.supabase_url, CFG.supabase_key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
} catch (e) { console.error(e); }
const PRUEBA = !sb;

function traducirError(err){
  const m = String((err && (err.message || err.error_description)) || err || "");
  if (/expired|invalid|otp/i.test(m)) return "Ese código no es correcto o ya se venció. Pide uno nuevo.";
  if (/security purposes|rate limit|after \d+ seconds|too many/i.test(m)) return "Espera un minuto antes de pedir otro código.";
  if (/email.*invalid|valid email/i.test(m)) return "Ese email no parece correcto.";
  if (/fetch|network|failed/i.test(m)) return "No hay conexión. Intenta otra vez.";
  return "Algo salió mal: " + m;
}

const Cuenta = PRUEBA ? {
  async enviarCodigo(email){ guardarLocal("yasui_prueba_email", email); },
  async verificar(email, codigo){ if (codigo !== "123456") throw new Error("invalid otp"); const u = {id: "prueba-" + norm(email).replace(/ /g,""), email}; guardarLocal("yasui_prueba_user", u); return u; },
  async usuario(){ return leerLocal("yasui_prueba_user", null); },
  async salir(){ guardarLocal("yasui_prueba_user", null); },
  async perfil(u){ return leerLocal("yasui_prueba_perfil_" + u.id, null); },
  async guardar(u, datos){ const p = {...(await this.perfil(u) || {}), ...datos, email: u.email, activo: true}; guardarLocal("yasui_prueba_perfil_" + u.id, p); return p; },
  async baja(u){ const p = await this.perfil(u); if (p) { p.activo = false; guardarLocal("yasui_prueba_perfil_" + u.id, p); } },
  async bajaConToken(){ return true; },
} : {
  async enviarCodigo(email){ const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } }); if (error) throw error; },
  async verificar(email, codigo){ const { data, error } = await sb.auth.verifyOtp({ email, token: codigo, type: "email" }); if (error) throw error; return data.user; },
  async usuario(){ const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
  async salir(){ await sb.auth.signOut(); },
  async perfil(u){ const { data, error } = await sb.from("suscriptores").select("nombre,destinos,activo").eq("user_id", u.id).maybeSingle(); if (error) throw error; return data; },
  async guardar(u, datos){
    const fila = { user_id: u.id, email: u.email, nombre: datos.nombre || null, destinos: datos.destinos, activo: true };
    const { data, error } = await sb.from("suscriptores").upsert(fila, { onConflict: "user_id" }).select("nombre,destinos,activo").single();
    if (error) throw error; return data;
  },
  async baja(u){ const { error } = await sb.from("suscriptores").update({ activo: false }).eq("user_id", u.id); if (error) throw error; },
  async bajaConToken(token){ const { data, error } = await sb.rpc("darse_de_baja", { p_token: token }); if (error) throw error; return data === true; },
};

function pantallaEntrar(paso = "email", msg = ""){

      sub: 'Escoge a dónde quieres ir y te avisamos por email cuando salgan precios locos o errores de tarifa. <span class="kanji">安い</span> <i>yasui</i> = barato en japonés.'
    }) + `
    <section class="centro"><div class="panel">
      <h2>Entra con tu email</h2>
      <p>No hace falta contraseña. Te mandamos un código nuevo cada vez que entres.</p>
      <form id="f-email" novalidate>
        <label class="campo" for="email">Tu email</label>
        <input class="txt" id="email" type="email" inputmode="email" autocomplete="email" placeholder="tu@email.com" value="${esc(E.email)}" required>
        <button class="btn pri full" id="b-enviar" type="submit">Enviarme el código</button>
        <div class="error" id="err">${esc(msg)}</div>
      </form>
      <ul class="puntos">
        <li><i>1</i><span><b>Escoge tus destinos.</b> Japón, Madrid, Hawaii... o "cualquier error de tarifa".</span></li>
        <li><i>2</i><span><b>Buscamos cada 4 horas</b> en Aviasales, Google Flights y sitios de mistake fares.</span></li>
        <li><i>3</i><span><b>Te escribimos solo cuando sale algo bueno.</b> Te puedes dar de baja cuando quieras.</span></li>
      </ul>
    </div></section>`;
    $("#f-email").onsubmit = async ev => {
      ev.preventDefault();
      const email = $("#email").value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $("#err").textContent = "Escribe un email válido."; return; }
      const b = $("#b-enviar"); b.disabled = true; b.textContent = "Enviando...";
      try { await Cuenta.enviarCodigo(email); E.email = email; guardarLocal("yasui_ultimo_email", email); pantallaEntrar("codigo"); }
      catch (err) { $("#err").textContent = traducirError(err); b.disabled = false; b.textContent = "Enviarme el código"; }
    };
    setTimeout(() => $("#email") && $("#email").focus(), 50);
    return;
  }
  // paso: código
  app.innerHTML = hero({ titulo: "Revisa tu email", sub: `Te mandamos un código a <b>${esc(E.email)}</b>.` }) + `
    <section class="centro"><div class="panel">
      <h2>Escribe el código</h2>
      <p>Es un código de números. Se vence en unos minutos y sirve una sola vez.${PRUEBA ? " <b>(Modo prueba: 123456)</b>" : ""}</p>
      <form id="f-codigo" novalidate>
        <label class="sr" for="codigo">Código</label>
        <input class="txt codigo num" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]*" placeholder="········">
        <button class="btn pri full" id="b-entrar" type="submit">Entrar</button>
        <div class="error" id="err">${esc(msg)}</div>
      </form>
      <p class="nota">¿No te llegó? Búscalo en spam o promociones. Llega de <b>${esc(CFG.remitente || "Yasui Flights")}</b>.</p>
      <p class="nota"><button class="link" id="b-reenviar" disabled>Reenviar código</button> &nbsp;·&nbsp; <button class="link" id="b-otro">Usar otro email</button></p>
    </div></section>`;
  const inp = $("#codigo");
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 10); };
  inp.onpaste = () => setTimeout(() => { if (inp.value.length >= 6) $("#f-codigo").requestSubmit(); }, 30);
  $("#f-codigo").onsubmit = async ev => {
    ev.preventDefault();
    const codigo = inp.value.trim();
    if (codigo.length < 6) { $("#err").textContent = "Escribe el código completo que te llegó por email."; return; }
    const b = $("#b-entrar"); b.disabled = true; b.textContent = "Entrando...";
    try { E.user = await Cuenta.verificar(E.email, codigo); await despuesDeEntrar(); }
    catch (err) { $("#err").textContent = traducirError(err); b.disabled = false; b.textContent = "Entrar"; inp.select(); }
  };
  $("#b-otro").onclick = () => pantallaEntrar("email");
  const rb = $("#b-reenviar"); let s = 60;
  const tick = () => { if (!document.body.contains(rb)) return; if (s <= 0) { rb.disabled = false; rb.textContent = "Reenviar código"; return; } rb.textContent = `Reenviar código (${s}s)`; s--; setTimeout(tick, 1000); };
  tick();
  rb.onclick = async () => {
    rb.disabled = true;
    try { await Cuenta.enviarCodigo(E.email); $("#err").innerHTML = '<span class="ok-txt">Te mandamos un código nuevo.</span>'; s = 60; tick(); }
    catch (err) { $("#err").textContent = traducirError(err); rb.disabled = false; }
  };
  setTimeout(() => inp.focus(), 50);
}

async function despuesDeEntrar(){
  try { E.perfil = await Cuenta.perfil(E.user); } catch (err) { E.perfil = null; console.error(err); }
  E.sel = (E.perfil && E.perfil.destinos) ? E.perfil.destinos.slice() : [];
  E.nombre = (E.perfil && E.perfil.nombre) || "";
  if (!E.perfil || !E.perfil.activo || !E.sel.length) pantallaDestinos(); else pantallaOfertas();
}

function pantallaDestinos(){

  $("#app").innerHTML = hero({
    menu: !nuevo,
    titulo: "¿A dónde quieres ir?",
    sub: "Escoge ciudades, países o regiones. Te avisamos de los mejores precios y errores de tarifa saliendo de San Juan (y de Aguadilla cuando sale mucho más barato) para esos lugares."
  }) + `
  <section class="centro ancho"><div class="panel">
    <label class="campo" for="nombre">¿Cómo te llamas? <span style="font-weight:400;color:var(--muted)">(opcional, para saludarte)</span></label>

    </div>
    <button class="btn pri full" id="b-guardar">Guardar mis destinos</button>
    <div class="error" id="err"></div>
  </div></section>`;

  const busca = $("#busca"), sug = $("#sug");
  let lista = [], activo = -1;
  const yaEsta = l => E.sel.some(d => d.t === l.t && d.c === l.c);
  function pintarSug(){
    if (!lista.length) { sug.hidden = true; busca.setAttribute("aria-expanded","false"); return; }
    sug.innerHTML = lista.map((l, i) => {
      const p = mejorPrecio(l);
      return `<div class="sug" role="option" id="sug-${i}" aria-selected="${i === activo}" data-i="${i}">
        <span><b>${esc(l.n)}</b><small>${esc(etiquetaTipo(l))}</small></span>
        ${yaEsta(l) ? '<span class="ya">Ya está</span>' : (p ? `<span class="desde num">desde ${dinero(p)}</span>` : "")}
      </div>`;
    }).join("");
    sug.hidden = false; busca.setAttribute("aria-expanded","true");
    sug.querySelectorAll(".sug").forEach(el => el.onmousedown = ev => { ev.preventDefault(); elegir(lista[+el.dataset.i]); });
  }
  function elegir(l){
    if (!l) return;
    if (!yaEsta(l)) {
      if (E.sel.length >= MAX_DESTINOS) { $("#err").textContent = `Máximo ${MAX_DESTINOS} destinos.`; return; }
      E.sel.push({ t: l.t, c: l.c, n: l.n });
    }
    busca.value = ""; lista = []; activo = -1; pintarSug(); pintarSel(); busca.focus();
  }
  busca.oninput = () => { lista = sugerencias(busca.value); activo = lista.length ? 0 : -1; pintarSug(); };
  busca.onkeydown = ev => {
    if (ev.key === "ArrowDown" && lista.length) { ev.preventDefault(); activo = (activo + 1) % lista.length; pintarSug(); }
    else if (ev.key === "ArrowUp" && lista.length) { ev.preventDefault(); activo = (activo - 1 + lista.length) % lista.length; pintarSug(); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (activo >= 0) elegir(lista[activo]); }
    else if (ev.key === "Escape") { lista = []; pintarSug(); }
  };
  busca.onblur = () => setTimeout(() => { lista = []; pintarSug(); }, 150);

  function chipsRapidas(){
    $("#rapidas").innerHTML = REGION_RAPIDA.map(r => {
      const on = E.sel.some(d => d.t === "r" && d.c === r);
      return `<button class="chip ${on ? "on" : ""}" data-r="${r}" aria-pressed="${on}">${esc(REGIONES[r])}</button>`;
    }).join("");
    $("#rapidas").querySelectorAll(".chip").forEach(b => b.onclick = () => {
      const r = b.dataset.r, i = E.sel.findIndex(d => d.t === "r" && d.c === r);
      if (i >= 0) E.sel.splice(i, 1); else E.sel.push({ t: "r", c: r, n: REGIONES[r] });
      pintarSel();
    });
    $("#populares").innerHTML = (D.populares || []).map(c => LUG_IDX["c:" + c]).filter(Boolean).map(l => {
      const on = yaEsta(l);
      return `<button class="chip ${on ? "on" : ""}" data-c="${esc(l.c)}" aria-pressed="${on}">${esc(l.n)}</button>`;
    }).join("");
    $("#populares").querySelectorAll(".chip").forEach(b => b.onclick = () => {
      const l = LUG_IDX["c:" + b.dataset.c], i = E.sel.findIndex(d => d.t === "c" && d.c === l.c);
      if (i >= 0) E.sel.splice(i, 1); else E.sel.push({ t: "c", c: l.c, n: l.n });
      pintarSel();
    });
  }
  function pintarTodo(){
    const on = E.sel.some(d => d.t === "r" && d.c === "todo");
    const b = $("#b-todo"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
  }
  $("#b-todo").onclick = () => {
    const i = E.sel.findIndex(d => d.t === "r" && d.c === "todo");
    if (i >= 0) E.sel.splice(i, 1); else E.sel.unshift({ ...TODO });
    pintarSel();
  };
  function pintarSel(){
    $("#elegidos").innerHTML = E.sel.length ? E.sel.map((d, i) =>
      `<span class="elegido">${esc(nombreDestino(d))}${d.t !== "c" && !["todo", "*"].includes(d.c) ? ` <small>${d.t === "p" ? "país" : "región"}</small>` : ""}<button aria-label="Quitar ${esc(nombreDestino(d))}" data-i="${i}">&times;</button></span>`).join("")
      : '<span class="vacio-sel">Todavía no has escogido nada. Busca arriba o toca uno de los botones.</span>';
    $("#elegidos").querySelectorAll("button").forEach(b => b.onclick = () => { E.sel.splice(+b.dataset.i, 1); pintarSel(); });
    $("#contador").textContent = E.sel.length ? `${E.sel.length} de ${MAX_DESTINOS}` : "";
    $("#b-guardar").disabled = !E.sel.length;
    chipsRapidas(); pintarTodo();
  }
  pintarSel();

  $("#b-guardar").onclick = async () => {
    const b = $("#b-guardar"); b.disabled = true; b.textContent = "Guardando...";
    E.nombre = $("#nombre").value.trim().slice(0, 60);
    try {
      E.perfil = await Cuenta.guardar(E.user, { nombre: E.nombre, destinos: E.sel });
      pantallaListo();
    } catch (err) { $("#err").textContent = traducirError(err); b.disabled = false; b.textContent = "Guardar mis destinos"; }
  };
}

function tarjeta(o, i = 0){

  if (o.tipo === "combinado") {
    const p = o.puente, t = o.tramo, ciudad = p.nombre, dest = o.destino_nombre;
    const comp = o.directo ? `Normal desde SJU ~${dinero(o.directo)}${o.descuento > 0 ? ` &middot; <strong>${Math.round(o.descuento * 100)}% menos</strong>` : ""}` : `Precio meta: ${dinero(o.meta)}`;
    const f = d => d ? esc(fmtFecha(d)) : "—";
    const conFechas = !!(p.salida && t.salida), algunaFecha = !!(p.salida || t.salida);
    const fila = (fecha, desde, hasta) => algunaFecha
      ? `<div class="itin-r"><span class="f num">${fecha}</span><span>${esc(desde)} → ${esc(hasta)}</span></div>`
      : `<div class="itin-r sin-f"><span>${esc(desde)} → ${esc(hasta)}</span></div>`;
    const cambio = p.aeropuerto && t.aeropuerto_origen && p.aeropuerto !== t.aeropuerto_origen
      ? `Llegas a ${p.aeropuerto} y el vuelo a ${dest} sale de ${t.aeropuerto_origen} (otro aeropuerto). ` : "";
    const cx = p.conexion || {};
    const conLinea = c => c ? `<div class="itin-con${algunaFecha ? "" : " sin-f"}">Mismo día en ${esc(c.aeropuerto || ciudad)}: llegas ${fmtHora(c.llega)}, el otro sale ${fmtHora(c.sale)} (${fmtMin(c.minutos)})</div>` : "";
    const riesgo = cx.ida || cx.vuelta
      ? `Conectas el mismo día con 2 boletos separados: si el primer vuelo se atrasa, la otra aerolínea no te espera y pierdes el segundo. Ve solo con equipaje de mano (si chequeas maleta tienes que recogerla y volver a chequearla)${cx.vuelta && o.pais !== "US" ? " y acuérdate de que al volver pasas por aduana" : ""}.`
      : "Si un vuelo se atrasa, la otra aerolínea no te espera: por eso llegas un día antes.";
    return `<article class="card n${o.nivel}" style="--i:${Math.min(i, 8)}">
      ${postal(o.region)}
      <div class="top"><span class="badges"><span class="badge combo">Combinado</span>${cx.ida || cx.vuelta ? `<span class="badge md">Mismo día</span>` : ""}<span class="badge niv">${esc(o.nivel_nombre)}</span></span><span class="reg">${esc(region)}</span></div>
      ${titulo}
      <div class="precio"><span class="monto num">${dinero(o.precio)}</span><span class="tipo">total${p.exacto ? "" : " aprox."} ida y vuelta</span></div>
      <div class="comp">${comp}</div>
      <div class="itin">
        <div class="itin-h">Ida</div>
        ${fila(f(p.salida), "SJU", ciudad)}
        ${conLinea(cx.ida)}
        ${fila(f(t.salida), ciudad, dest)}
        <div class="itin-h">Vuelta</div>
        ${fila(f(t.regreso), dest, ciudad)}
        ${conLinea(cx.vuelta)}
        ${fila(f(p.regreso), ciudad, "SJU")}
        ${conFechas ? "" : `<div class="itin-nota">${t.salida ? "" : "Las fechas del vuelo a " + esc(dest) + " están en el post. "}El precio SJU ⇄ ${esc(ciudad)} es el típico; depende de las fechas que escojas.</div>`}
      </div>
      <div class="boletos">
        <div class="boletos-h">Son 2 boletos separados:</div>
        <div class="bol">${LOGO(p.aerolinea_iata, p.aerolinea)}<span>SJU ⇄ ${esc(ciudad)}</span><b class="num">${p.exacto ? "" : "~"}${dinero(p.precio)}</b>${p.aerolinea ? `<small>${esc(p.aerolinea)}</small>` : ""}</div>
        <div class="bol">${LOGO(t.aerolinea_iata, t.aerolinea)}<span>${esc(ciudad)} ⇄ ${esc(dest)}</span><b class="num">${dinero(t.precio)}</b><small>${esc([t.aerolinea, t.sitio].filter(Boolean).join(" · "))}</small></div>
      </div>
      ${t.titulo ? `<p class="titulo">"${esc(t.titulo)}"</p>` : ""}
      <div class="ojo">${esc(cambio)}${esc(riesgo)}</div>
      ${motivos}
      <div class="acciones col">
        <a class="btn osc" href="${esc(p.link)}" target="_blank" rel="noopener">Boleto SJU ⇄ ${esc(ciudad)}</a>
        <a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">Boleto ${esc(ciudad)} ⇄ ${esc(dest)}</a>
      </div>
    </article>`;
  }
  const fechas = o.salida ? `${fmtFecha(o.salida)}${o.regreso ? ` &rarr; ${fmtFecha(o.regreso)} &middot; ${dias(o.salida, o.regreso)} días` : " &middot; solo ida"}` : "Fechas en el post";
  const escalas = o.escalas == null ? null : (o.escalas === 0 ? "directo" : `${o.escalas} escala${o.escalas > 1 ? "s" : ""}`);
  const vuelo = [o.aerolinea, escalas].filter(Boolean).map(esc).join(" &middot; ");
  const comp = o.mediana ? `Normal ~${dinero(o.mediana)}${o.descuento > 0 ? ` &middot; <strong>${Math.round(o.descuento * 100)}% menos</strong>` : ""}` : (o.meta ? `Precio meta: ${dinero(o.meta)}` : "");
  let verif = "";
  if (o.fuente !== "google" && o.verificado === true) verif = `<div class="verif si">Confirmado en Google Flights: ${dinero(o.precio_google)}</div>`;
  else if (o.verificado === false) verif = `<div class="verif no">Google Flights lo tiene a ${dinero(o.precio_google)} para esas fechas (puede que ya no esté)</div>`;
  const ec = o.escala_corta;
  const escala = ec ? `<div class="ojo"><b>Escala corta:</b> en ${esc(ec.aeropuerto || "la escala")} llegas ${fmtHora(ec.llega)} y el otro avión sale ${fmtHora(ec.sale)} (${fmtMin(ec.minutos)}). Es un solo boleto, así que si el primero se atrasa la aerolínea te reubica, pero hay que moverse rápido.</div>` : "";
  const otroAp = o.origen && o.origen !== "SJU";
  const ver = o.link && o.fuente !== "google" ? `<a class="btn" href="${esc(o.link)}" target="_blank" rel="noopener">${o.fuente === "feed" ? "Ver post" : "Aviasales"}</a>` : "";
  return `<article class="card n${o.nivel}" style="--i:${Math.min(i, 8)}">
    ${postal(o.region)}
    <div class="top"><span class="badges">${otroAp ? `<span class="badge bqn">Sale de ${esc(salidaDe(o))}</span>` : ""}<span class="badge niv">${esc(o.nivel_nombre)}</span></span><span class="reg">${esc(region)}</span></div>
    ${titulo}
    <div class="precio"><span class="monto num">${dinero(o.precio)}</span><span class="tipo">${o.ida_y_vuelta ? "ida y vuelta" : "solo ida"} desde ${esc(otroAp ? salidaDe(o) + " (" + o.origen + ")" : "SJU")}</span></div>
    <div class="comp">${comp}</div>
    <ul class="det">
      <li>${ICON.cal}<span>${fechas}</span></li>
      ${vuelo ? `<li>${o.aerolinea ? LOGO(o.aerolinea_iata, o.aerolinea) : ICON.vuelo}<span>${vuelo}</span></li>` : ""}
      <li>${ICON.ojo}<span>${esc(o.sitio || o.fuente)} &middot; ${hace(o.fuente === "feed" ? (o.encontrado || o.primera_vez) : o.ultima_vez)}</span></li>
    </ul>
    ${o.titulo ? `<p class="titulo">"${esc(o.titulo)}"</p>` : ""}
    ${verif}${escala}${motivos}
    <div class="acciones"><a class="btn osc" href="${esc(o.fuente === "google" && o.link ? o.link : o.link_google)}" target="_blank" rel="noopener">Google Flights</a>${ver}</div>
  </article>`;
}

const ordenar = l => l.sort((a,b) => b.nivel - a.nivel || (b.descuento || 0) - (a.descuento || 0) || a.precio - b.precio);

function tarjetaRadar(d){
  const ofertas = ordenar((D.ofertas || []).filter(o => coincide(o, [d])));
  const mejor = ofertas[0];
  let precio = null, info = "", link = "";
  if (d.t === "c" && PRECIOS[d.c]) {
    const p = PRECIOS[d.c]; precio = p.precio; link = p.link;
    info = [p.salida ? `${fmtFecha(p.salida)}–${fmtFecha(p.regreso)}` : (p.fecha && p.fecha !== D.hoy ? `visto ${fmtFecha(p.fecha)}` : ""), p.mediana ? `normal ~${dinero(p.mediana)}` : ""].filter(Boolean).join(" · ");
  } else if (d.c === "todo") {
    const baratos = Object.entries(PRECIOS).sort((a, b) => a[1].precio - b[1].precio);
    if (baratos.length) { const [c, p] = baratos[0]; precio = p.precio; link = p.link; info = `Lo más barato ahora: ${p.nombre || c}`; }
  } else if (d.t !== "c") {
    precio = mejorPrecio(d);
    info = d.c === "*" ? "Te avisamos de cualquier error de tarifa" : "mejor precio en esa zona";
  }
  if (mejor && (precio == null || mejor.precio <= precio)) { precio = mejor.precio; link = mejor.tipo === "combinado" ? mejor.tramo.link : mejor.link_google; info = `${mejor.destino_nombre}${mejor.tipo === "combinado" ? " (combinado)" : ""}`; }
  return `<div class="rd">
    <div class="t"><span>${esc(nombreDestino(d))}</span>${d.t !== "c" && !["todo", "*"].includes(d.c) ? `<small>${d.t === "p" ? "país" : "región"}</small>` : ""}</div>
    ${mejor ? `<span class="hay">${ofertas.length} oferta${ofertas.length > 1 ? "s" : ""}</span>` : ""}
    <div class="p num ${precio == null ? "sin" : ""}">${precio == null ? (d.c === "*" ? "Vigilando" : "Buscando precios...") : "desde " + dinero(precio)}</div>
    ${info ? `<div class="d">${esc(info)}</div>` : ""}
    ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Buscar vuelos</a>` : ""}
  </div>`;
}

function pantallaOfertas(){
  const nombre = E.nombre ? `, ${esc(E.nombre)}` : "";
  const todas = ordenar((D.ofertas || []).slice());
  const mias = todas.filter(o => coincide(o, E.sel));
  const otras = todas.filter(o => !coincide(o, E.sel));
  $("#app").innerHTML = hero({ menu: true, alto: true, extra: `<div class="saludo"><div><h1>Hola${nombre}</h1><p>Actualizado ${esc(hace(D.generado))} · buscamos cada 4 horas · precios en USD por persona</p></div></div>` }) + `
  <main class="wrap">
    <section class="radar">${E.sel.map((d, i) => tarjetaRadar(d).replace('<div class="rd">', `<div class="rd" style="animation-delay:${Math.min(i, 8) * 50}ms">`)).join("")}</section>

    <h2 class="sec">Ofertas para ti</h2>
    <p class="h2sub">Las de tus destinos, las más locas primero. Si algo te gusta, búscalo ya: estos precios duran poco.</p>
    <section class="grid">${mias.length ? mias.map((o, i) => tarjeta(o, i)).join("") : `<div class="vacio">Ahora mismo no hay ofertas locas para tus destinos. Seguimos buscando y te escribimos apenas salga algo.</div>`}</section>

    ${otras.length ? `<div class="mas"><button class="btn" id="b-todas">${E.verTodas ? "Esconder" : "Ver"} otras ofertas (${otras.length})</button></div>
    <section class="grid" id="otras" style="margin-top:14px" ${E.verTodas ? "" : "hidden"}>${E.verTodas ? otras.slice(0, 60).map((o, i) => tarjeta(o, i)).join("") : ""}</section>` : ""}

    <footer class="pie">
      <div><h4>Reserva primero, planifica después</h4><p>Desde Puerto Rico aplica la regla de 24 horas del DOT: si reservas con 7+ días de anticipación, puedes cancelar gratis dentro de 24 horas.</p></div>
      <div><h4>No compres hotel todavía</h4><p>Espera a que la aerolínea emita el boleto. A veces cancelan los errores de tarifa.</p></div>
      <div><h4>Combinados</h4><p>Son boletos separados: si el primer vuelo se atrasa, la otra aerolínea no te ayuda. Llega un día antes.</p></div>
    </footer>
    <div class="baja-zona" id="baja-zona">
      <span>¿Ya no quieres recibir emails?</span> <button class="link" id="b-baja">Darme de baja</button>
    </div>
  </main>`;
  const bt = $("#b-todas");
  if (bt) bt.onclick = () => { E.verTodas = !E.verTodas; pantallaOfertas(); setTimeout(() => $("#otras") && $("#otras").scrollIntoView({behavior:"smooth", block:"start"}), 30); };
  $("#b-baja").onclick = () => {
    $("#baja-zona").innerHTML = `<span><b>¿Seguro?</b> Ya no te van a llegar emails de Yasui Flights.</span>
      <button class="btn" id="b-baja-si">Sí, darme de baja</button><button class="link" id="b-baja-no">Cancelar</button>`;
    $("#b-baja-no").onclick = pantallaOfertas;
    $("#b-baja-si").onclick = async () => {
      try { await Cuenta.baja(E.user); E.perfil = { ...(E.perfil || {}), activo: false }; pantallaBajaLista(true); }
      catch (err) { $("#baja-zona").innerHTML = `<span class="error">${esc(traducirError(err))}</span>`; }
    };
  };
}

/* ============================================================ PANTALLA: baja */
function pantallaBajaLista(ok, porLink = false){
  $("#app").innerHTML = hero({ menu: !porLink && !!E.user }) + `
  <section class="centro"><div class="panel listo">
    <h2>${ok ? "Listo, te diste de baja" : "Ese link ya no sirve"}</h2>
    <p>${ok ? "Ya no te van a llegar emails de Yasui Flights." : "Puede que ya te hubieras dado de baja. Si quieres, entra con tu email y lo revisas."}</p>
    <div class="caja">¿Cambiaste de idea? Entra con tu email y guarda tus destinos otra vez.</div>
    <div class="acciones-listo"><button class="btn pri" onclick="irDestinos()">Volver a apuntarme</button></div>
  </div></section>`;
}
async function pantallaBaja(token){
  $("#app").innerHTML = hero({}) + `<section class="centro"><div class="panel listo"><h2>Dándote de baja...</h2></div></section>`;
  let ok = false;
  try { ok = await Cuenta.bajaConToken(token); } catch (err) { console.error(err); }
  history.replaceState(null, "", location.pathname);
  pantallaBajaLista(ok, true);
}

/* ============================================================ navegación */
function irInicio(){ if (E.user) { (E.sel.length && E.perfil && E.perfil.activo) ? pantallaOfertas() : pantallaDestinos(); } else pantallaEntrar(); window.scrollTo(0,0); return false; }
async function irDestinos(){ if (!E.user) return pantallaEntrar(); pantallaDestinos(); window.scrollTo(0,0); }
async function salir(){ try { await Cuenta.salir(); } catch (e) {} E.user = null; E.perfil = null; E.sel = []; pantallaEntrar(); }

function bienvenida(){
  const sp = $("#splash"); if (!sp) return;
  const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let listo = false;
  const cerrar = () => { if (listo) return; listo = true; sp.classList.add("fuera"); setTimeout(() => sp.remove(), 600); };
  sp.addEventListener("click", cerrar);
  document.addEventListener("keydown", cerrar, { once: true });
  setTimeout(cerrar, reducido ? 900 : 2400);
}

async function iniciar(){
  bienvenida();
  avisosTop();
  const m = location.hash.match(/^#baja=([0-9a-f-]{36})$/i);
  if (m) return pantallaBaja(m[1]);
  try { E.user = await Cuenta.usuario(); } catch (e) { E.user = null; }
  if (E.user) await despuesDeEntrar(); else pantallaEntrar();
}
iniciar();
</script>
